version: v1.0

plan: standard-2

commands:
  - checkout
  - neetoci-version ruby 4.0.5
  - neetoci-service start redis 7.0.5
  - bundle config path 'vendor/bundle'
  - cache restore
  - bundle install --jobs 1
  - cache store

  - bundle exec rake test
  - bash .neetoci/scripts/publish_gem.sh

triggers:
  - event: branch
    branch_name: main
  - event: pull_request
